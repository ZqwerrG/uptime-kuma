zerops:
  # 注意：如果你的服务名不是 uptime-kuma，请修改这里
  - setup: uptime-kuma
    build:
      base: ubuntu@latest
      buildCommands:
        # 这一步会自动为你生成一个适配 Zerops 网络的 docker-compose.yml
        - |
          cat <<EOF > docker-compose.yml
          services:
            app:
              image: louislam/uptime-kuma:latest
              network_mode: "host"
              volumes:
                - /mnt/data:/app/data
          EOF
      deployFiles:
        - ./docker-compose.yml
      addToRunPrepare:
        - ./docker-compose.yml

    run:
      base: docker@latest
      prepareCommands:
        - docker compose pull app
      start: docker compose up app --force-recreate
      ports:
        - port: 3001
          httpSupport: true
